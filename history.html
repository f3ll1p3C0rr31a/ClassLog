<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16324f" />
    <title>ClassLog</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="history">
    <main class="app-shell">
      <section class="hero-card">
        <div>
          <p class="eyebrow" id="pageSubtitle">Histórico</p>
          <h1 id="pageTitle">Ocorrências salvas</h1>
          <p class="hero-copy" id="pageDescription">Veja registros recentes e filtre por alunos selecionados.</p>
        </div>
        <div class="hero-stats">
          <article>
            <span id="todayCount">0</span>
            <small>hoje</small>
          </article>
          <article>
            <span id="selectedCount">0</span>
            <small>selecionados</small>
          </article>
          <article>
            <span id="lastSavedLabel">--</span>
            <small>último registro</small>
          </article>
        </div>
      </section>

      <nav class="step-nav">
        <a class="step-link" href="index.html">Alunos</a>
        <a class="step-link" href="occurrence.html">Ocorrência</a>
        <a class="step-link" href="finalize.html">Salvar</a>
        <a class="step-link active" href="history.html">Histórico</a>
      </nav>

      <section class="panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Filtro</p>
            <h2>Visão do histórico</h2>
          </div>
          <div class="history-actions">
            <button class="ghost-button" type="button" id="historySelectedButton">Selecionados</button>
            <button class="ghost-button" type="button" id="historyAllButton">Todos</button>
          </div>
        </div>
        <div class="selection-summary" id="selectedStudentsStrip" aria-live="polite"></div>
        <p class="hint" id="historyHint">Selecione um aluno para ver o histórico filtrado.</p>
        <div class="page-actions split-actions">
          <button class="ghost-button" type="button" id="historyBackButton">Voltar</button>
          <button class="ghost-button danger" type="button" id="clearAllButton">Limpar tudo</button>
        </div>
      </section>

      <section class="panel">
        <div class="records" id="records"></div>
      </section>
    </main>

    <template id="recordTemplate">
      <article class="record-card">
        <div class="record-main">
          <div>
            <div class="record-students"></div>
            <p class="record-occurrence"></p>
          </div>
          <time class="record-datetime"></time>
        </div>
        <p class="record-notes"></p>
        <div class="record-meta"></div>
        <div class="record-photo-wrap"></div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>

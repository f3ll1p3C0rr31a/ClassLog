name: Deploy ClassLog

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: classlog-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy production on Jupiter
    runs-on: [self-hosted, linux, x64, classlog-jupiter]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check app.js
          node --check offline-store.js
          node --check handwriting.js
          node --check service-worker.js
          node --check scripts/prepare-web-assets.js
          node --check scripts/check-app-logic.js

      - name: Test app logic and widget layout
        run: npm test

      - name: Prepare PWA assets
        run: npm run web:prepare

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Deploy to classlog-api
        run: bash scripts/deploy-production.sh
